<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time is up</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="float.css" />
  </head>
  <body class="float-body due-body">
    <main class="float-app">
      <header class="due-hero">
        <div class="bell" aria-hidden="true">
          <span class="bell-pulse"></span>
          <svg viewBox="0 0 24 24" width="28" height="28">
            <path
              fill="currentColor"
              d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"
            />
          </svg>
        </div>
        <div>
          <p class="eyebrow">Reminder</p>
          <h1>Time is up</h1>
          <p class="float-note">The side panel keeps this alert if you close the window.</p>
        </div>
        <button type="button" class="ghost icon" id="closeDue" aria-label="Close">✕</button>
      </header>
      <p class="float-error" id="dueError" hidden></p>
      <div class="float-list" id="dueList"></div>
    </main>
    <script type="module" src="due.js"></script>
  </body>
</html>
